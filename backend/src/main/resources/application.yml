server:
  # 로컬/도커는 8080, Railway 등 PaaS 는 주입되는 PORT 로 리슨
  port: ${PORT:8080}

spring:
  application:
    name: mpark-wms
  datasource:
    # 서버 이관 시 DB_URL 만 바꿔도 되도록 기본 로컬 값을 환경변수로 래핑
    url: ${DB_URL:jdbc:mysql://localhost:3306/mpark_wms?serverTimezone=Asia/Seoul&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USER:mpark}
    password: ${DB_PASSWORD:mpark}
  jpa:
    hibernate:
      # 스키마는 Flyway 가 관리. JPA 는 검증만 (엔티티↔테이블 불일치 시 기동 실패로 조기 발견)
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:true}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:12MB}

# 앱 설정 (Phase 5/6 에서 사용)
app:
  cors:
    # Vue dev 서버 (로컬). 운영 도메인은 배포 시 추가
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:5177}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-please-change-min-32-bytes-long-key-0123456789}
    expiration-ms: ${JWT_EXPIRATION_MS:604800000}   # 7일
  storage:
    dir: ${STORAGE_DIR:./uploads}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:8080/files}
  ai:
    api-key: ${OPENAI_API_KEY:}
    # 챗봇/사진검색: 저비용 소형 모델(툴 기반이라 충분). 비용 큰 폭 절감.
    model: ${OPENAI_MODEL:${AI_MODEL:gpt-4o-mini}}
    # 사진 인식(제품 찾아보기) 비전 모델. 제품목록을 프롬프트에 줘서 mini로도 충분(객관식). 필요 시 gpt-4o로 격상.
    vision-model: ${OPENAI_VISION_MODEL:gpt-4o}
    # 견적서 추출: 비용 절감 위해 mini 사용(검산 규칙으로 정확도 보완). 필요 시 OPENAI_EXTRACT_MODEL 로 gpt-4o 복귀.
    extract-model: ${OPENAI_EXTRACT_MODEL:gpt-4o-mini}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  minimax:
    # MiniMax(Hailuo) TTS(음성 합성). 미설정 시 프론트가 브라우저 기본 음성으로 폴백.
    api-key: ${MINIMAX_API_KEY:}
    group-id: ${MINIMAX_GROUP_ID:}
    base-url: ${MINIMAX_BASE_URL:https://api.minimax.io}
    model: ${MINIMAX_MODEL:speech-02-hd}
    voice-id: ${MINIMAX_VOICE_ID:Korean_SweetGirl}
    speed: ${MINIMAX_SPEED:1.2}   # 말하기 속도 0.5~2.0 (기본 1.2 = 약간 빠름)

logging:
  level:
    org.hibernate.SQL: ${HIBERNATE_SQL_LOG_LEVEL:debug}
