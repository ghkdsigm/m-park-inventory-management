server:
  # 로컬/도커는 8080, Railway 등 PaaS 는 주입되는 PORT 로 리슨
  port: ${PORT:8080}

spring:
  application:
    name: mpark-wms
  datasource:
    url: jdbc:mysql://localhost:3306/mpark_wms?serverTimezone=Asia/Seoul&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:mpark}
    password: ${DB_PASSWORD:mpark}
  jpa:
    hibernate:
      # 스키마는 Flyway 가 관리. JPA 는 검증만 (엔티티↔테이블 불일치 시 기동 실패로 조기 발견)
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

# 앱 설정 (Phase 5/6 에서 사용)
app:
  cors:
    # Vue dev 서버 (로컬). 운영 도메인은 배포 시 추가
    allowed-origins: ${CORS_ORIGINS:http://localhost:5175,http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-please-change-min-32-bytes-long-key-0123456789}
    expiration-ms: 604800000   # 7일
  storage:
    dir: ${STORAGE_DIR:./uploads}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:8080/files}
  ai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:${AI_MODEL:gpt-4o}}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  minimax:
    # MiniMax(Hailuo) TTS(음성 합성). 미설정 시 프론트가 브라우저 기본 음성으로 폴백.
    api-key: ${MINIMAX_API_KEY:}
    group-id: ${MINIMAX_GROUP_ID:}
    base-url: ${MINIMAX_BASE_URL:https://api.minimax.io}
    model: ${MINIMAX_MODEL:speech-02-hd}
    voice-id: ${MINIMAX_VOICE_ID:Korean_SweetGirl}

logging:
  level:
    org.hibernate.SQL: debug
