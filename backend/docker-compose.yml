# 로컬 개발용: MySQL 8 + 백엔드(Spring) 한 번에. 호스트에 Java 불필요.
# 사용: backend 폴더에서  docker compose up -d --build
services:
  mysql:
    image: mysql:8.0
    container_name: mpark-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mpark_wms
      MYSQL_USER: mpark
      MYSQL_PASSWORD: mpark
      TZ: Asia/Seoul
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: .
    container_name: mpark-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: Asia/Seoul
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mpark_wms?serverTimezone=Asia/Seoul&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: mpark
      DB_PASSWORD: mpark
      JWT_SECRET: dev-only-secret-please-change-min-32-bytes-long-key-0123456789
      CORS_ORIGINS: http://localhost:5175,http://localhost:5173
      STORAGE_DIR: /app/uploads
      STORAGE_PUBLIC_BASE_URL: http://localhost:8080/files
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
    ports:
      - "8080:8080"
    volumes:
      - backend_uploads:/app/uploads

volumes:
  mysql_data:
  backend_uploads:
